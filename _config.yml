title: open9527
subtitle: 年少不被层楼误，余生不羁尽自由。
description: Everyday is a new day, a new start, a new life!
keywords: open9527,Android,Flutter,Kotlin
author: open9527
language: zh-CN
timezone: Asia/Shanghai

url: https://open9527.github.io
root: /
permalink: posts/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:
  - README.md
include:
  - .nojekyll

new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ""
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: prismjs
highlight:
  enable: false
  line_number: false
  auto_detect: false
  tab_replace: ""
  wrap: true
  hljs: false
prismjs:
  enable: true
  preprocess: true
  line_number: false
  tab_replace: ""

index_generator:
  path: ""
  per_page: 12
  order_by: -date

default_category: 未分类
category_map:
tag_map:
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: date

search:
  path: search.xml
  field: post
  content: true
  format: html

theme: butterfly

deploy:
  type: ""
